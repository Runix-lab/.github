<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
<title id="title">Runix Lab — the AI infrastructure stack</title>
<desc id="desc">Five layers: Code and Comic agents in development; Router gateway, Models, Data and FS in early access; Pipeline in development. Runs on your cloud and compute. Free public learning includes AI for Science and embodied AI data foundations.</desc>
