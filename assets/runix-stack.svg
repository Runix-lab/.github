<text x="52" y="125" font-size="32" font-weight="700" letter-spacing="-1" fill="#0d1117">Rebuild AI Unix.</text>
<text x="390" y="124" font-size="18" fill="#48505e">Five layers. Seven products. One connected stack.</text>
<text x="54" y="219" font-size="15" font-weight="700" fill="#4a5bd6" letter-spacing="1">05</text><text x="54" y="246" font-size="16" font-weight="700" fill="#0d1117" letter-spacing="0.8">AGENTS</text><text x="54" y="270" font-size="14" font-weight="400" fill="#676f7b" >Work &amp; applications</text><text x="54" y="329" font-size="15" font-weight="700" fill="#4a5bd6" letter-spacing="1">04</text><text x="54" y="356" font-size="16" font-weight="700" fill="#0d1117" letter-spacing="0.8">GATEWAY</text><text x="54" y="380" font-size="14" font-weight="400" fill="#676f7b" >Access &amp; control</text><text x="54" y="439" font-size="15" font-weight="700" fill="#4a5bd6" letter-spacing="1">03</text><text x="54" y="466" font-size="16" font-weight="700" fill="#0d1117" letter-spacing="0.8">MODELS</text><text x="54" y="490" font-size="14" font-weight="400" fill="#676f7b" >Tune &amp; serve</text><text x="54" y="549" font-size="15" font-weight="700" fill="#4a5bd6" letter-spacing="1">02</text><text x="54" y="576" font-size="16" font-weight="700" fill="#0d1117" letter-spacing="0.8">DATA</text><text x="54" y="600" font-size="14" font-weight="400" fill="#676f7b" >Prepare &amp; evaluate</text><text x="54" y="659" font-size="15" font-weight="700" fill="#4a5bd6" letter-spacing="1">01</text><text x="54" y="686" font-size="16" font-weight="700" fill="#0d1117" letter-spacing="0.8">INFRASTRUCTURE</text><text x="54" y="710" font-size="14" font-weight="400" fill="#676f7b" >Store &amp; cache</text><rect x="254" y="190" width="434" height="94" rx="10" fill="white" stroke="#dfe2e8"/><text x="276" y="224" font-size="23" font-weight="700" fill="#0d1117" >Runix Code</text><rect x="513" y="207" width="153" height="24" rx="12" fill="#eff0f5"/><text x="589.5" y="223" font-size="11" font-weight="700" fill="#555c6c" text-anchor="middle" letter-spacing="0.7">IN DEVELOPMENT</text><text x="276" y="258" font-size="15" font-weight="400" fill="#48505e" >Coding agents · reviewable changes</text><rect x="704" y="190" width="434" height="94" rx="10" fill="white" stroke="#dfe2e8"/><text x="726" y="224" font-size="23" font-weight="700" fill="#0d1117" >Runix Comic</text><rect x="963" y="207" width="153" height="24" rx="12" fill="#eff0f5"/><text x="1039.5" y="223" font-size="11" font-weight="700" fill="#555c6c" text-anchor="middle" letter-spacing="0.7">IN DEVELOPMENT</text><text x="726" y="258" font-size="15" font-weight="400" fill="#48505e" >Creative agents · script to episode</text><rect x="254" y="300" width="884" height="94" rx="10" fill="white" stroke="#dfe2e8"/><text x="276" y="334" font-size="23" font-weight="700" fill="#0d1117" >Runix Router · Gateway</text><rect x="986" y="317" width="130" height="24" rx="12" fill="#e9f4ef"/><text x="1051.0" y="333" font-size="11" font-weight="700" fill="#286047" text-anchor="middle" letter-spacing="0.7">EARLY ACCESS</text><text x="276" y="368" font-size="15" font-weight="400" fill="#48505e" >One model endpoint · routing, key custody and usage controls</text><rect x="254" y="410" width="884" height="94" rx="10" fill="white" stroke="#dfe2e8"/><text x="276" y="444" font-size="23" font-weight="700" fill="#0d1117" >Runix Models</text><rect x="986" y="427" width="130" height="24" rx="12" fill="#e9f4ef"/><text x="1051.0" y="443" font-size="11" font-weight="700" fill="#286047" text-anchor="middle" letter-spacing="0.7">EARLY ACCESS</text><text x="276" y="478" font-size="15" font-weight="400" fill="#48505e" >Open-weight models · fine-tuning and dedicated serving</text><rect x="254" y="520" width="434" height="94" rx="10" fill="white" stroke="#dfe2e8"/><text x="276" y="554" font-size="23" font-weight="700" fill="#0d1117" >Runix Data</text><rect x="536" y="537" width="130" height="24" rx="12" fill="#e9f4ef"/><text x="601.0" y="553" font-size="11" font-weight="700" fill="#286047" text-anchor="middle" letter-spacing="0.7">EARLY ACCESS</text><text x="276" y="588" font-size="15" font-weight="400" fill="#48505e" >Domain data · provenance &amp; quality</text><rect x="704" y="520" width="434" height="94" rx="10" fill="white" stroke="#dfe2e8"/><text x="726" y="554" font-size="23" font-weight="700" fill="#0d1117" >Runix Pipeline</text><rect x="963" y="537" width="153" height="24" rx="12" fill="#eff0f5"/><text x="1039.5" y="553" font-size="11" font-weight="700" fill="#555c6c" text-anchor="middle" letter-spacing="0.7">IN DEVELOPMENT</text><text x="726" y="588" font-size="15" font-weight="400" fill="#48505e" >Preparation tooling · auditable stages</text><rect x="254" y="630" width="884" height="94" rx="10" fill="white" stroke="#dfe2e8"/><text x="276" y="664" font-size="23" font-weight="700" fill="#0d1117" >Runix FS</text><rect x="986" y="647" width="130" height="24" rx="12" fill="#e9f4ef"/><text x="1051.0" y="663" font-size="11" font-weight="700" fill="#286047" text-anchor="middle" letter-spacing="0.7">EARLY ACCESS</text><text x="276" y="698" font-size="15" font-weight="400" fill="#48505e" >AI filesystem · POSIX access and cache over object storage</text><rect x="54" y="746" width="1084" height="65" rx="10" fill="#eceef9"/><text x="76" y="773" font-size="13" font-weight="700" fill="#3c49ad" letter-spacing="0.7">00  YOUR FOUNDATION</text><text x="76" y="796" font-size="17" font-weight="400" fill="#283349" >Your cloud, GPUs, Kubernetes and object storage</text><text x="1116" y="783" font-size="16" font-weight="400" fill="#3c49ad" text-anchor="end">Use one layer, or connect the stack.</text><text x="54" y="846" font-size="11" font-weight="700" fill="#676f7b" letter-spacing="0.8">REQUEST PATH</text><text x="185" y="846" font-size="15" font-weight="400" fill="#48505e" >Agents → Router → hosted providers or Runix Models</text><text x="54" y="874" font-size="11" font-weight="700" fill="#676f7b" letter-spacing="0.8">DATA PATH</text><text x="185" y="874" font-size="15" font-weight="400" fill="#48505e" >Object storage → FS → Pipeline &amp; Data → Models</text><line x1="54" y1="899" x2="1138" y2="899" stroke="#dfe2e8"/><text x="54" y="929" font-size="11" font-weight="700" fill="#4a5bd6" letter-spacing="0.8">OPEN LEARNING</text><text x="208" y="929" font-size="17" font-weight="600" fill="#0d1117" >AI for Science for Programmers  ·  Embodied AI Data Foundations</text><text x="54" y="956" font-size="13" font-weight="400" fill="#676f7b" >Product availability follows runixcloud.io. Open-source and learning licenses are separate from hosted services.</text></g></svg>
