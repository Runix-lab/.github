name: Public learning checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  learning:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check links and reproduce the synthetic exercise
        run: python scripts/check_resources.py
      - name: Check patch whitespace
        run: git diff-tree --check -m HEAD
